aid: wecasa
name: Wecasa
description: 'Wecasa is a French on-demand home-services marketplace that connects households
  with vetted independent professionals who deliver the service at the customer''s home. Its
  catalogue spans household cleaning and ironing, childcare and babysitting, mobile hairdressing,
  at-home beauty and nail care, massage and wellness, and personal fitness coaching. Customers
  book, schedule and pay through the Wecasa web site or the iOS/Android app; the professionals
  who fulfil the work run their business through the separate Wecasa Pro app. Founded in France
  and backed by Serena, the company operates in France, the United Kingdom, Germany, Austria and
  Switzerland. Wecasa publishes no public developer program, API reference or machine-readable
  contract — the platform is a consumer application and a partner-onboarding funnel, not a
  developer product.'
