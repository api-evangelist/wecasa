  reason: no-developer-program
  detail: >-
    Wecasa ships software only as an end-user product — a consumer booking app and a separate
    Wecasa Pro app for professionals — and every candidate developer hostname (api., developers.,
    developer., docs., app., admin., partners.wecasa.fr) fails to resolve in DNS at all, so there
    is no portal, reference or contract to read; the /pro "become a partner" funnel is a human
    recruitment form that hands the professional a mobile app, not a partner API.
